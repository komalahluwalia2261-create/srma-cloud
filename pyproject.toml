[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srma-cloud"
version = "0.1.0"
description = "Cloud-native LLM screening for systematic reviews — screens directly from a watched Drive/cloud folder, no manual export/upload step."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "pypdf>=4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
srma-cloud = "srma_cloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
